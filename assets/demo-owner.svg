<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard pemilik sintetis Kedai Nusa</title>
  <desc id="desc">Ringkasan penjualan, transaksi, pembayaran dan jam penjualan untuk data demo.</desc>
  <rect width="960" height="620" fill="#f3f5f0"/>
  <rect width="220" height="620" fill="#13251f"/>
  <g font-family="Arial,sans-serif">
