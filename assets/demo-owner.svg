    <text x="30" y="104" fill="#7fa494" font-size="12" font-weight="700">KEDAI NUSA · DEMO</text>
    <rect x="18" y="133" width="184" height="43" rx="10" fill="#234a3d"/>
    <text x="34" y="160" fill="#fff" font-size="14" font-weight="700">Ringkasan pemilik</text>
    <text x="34" y="216" fill="#a8b9b2" font-size="14">Penjualan</text>
