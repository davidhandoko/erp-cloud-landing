      <line x1="42" y1="249" x2="408" y2="249" stroke="#d8ddd4"/>
      <line x1="42" y1="191" x2="408" y2="191" stroke="#edf0eb"/>
      <line x1="42" y1="133" x2="408" y2="133" stroke="#edf0eb"/>
      <path d="M48 226 C92 221,112 190,150 198 S210 144,249 164 S311 82,350 112 S390 95,405 77" fill="none" stroke="#ef8d4d" stroke-width="5" stroke-linecap="round"/>
